services:
  mysql:
    image: mysql:8.4
    container_name: sunudiab-mysql
    environment:
      MYSQL_DATABASE: sunudiab
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - sunudiab-data:/var/lib/mysql
volumes:
  sunudiab-data:
